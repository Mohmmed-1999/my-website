<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>زنجر نصف كيلو</title>
</head>
<body>
<div class="page-container">
    <div class="right-side">
        <img src="../img/نص كيلو زنجر.jfif">
    </div>

    <div class="left-side">
        <div class="content-wrapper">
            <h1 class="meal-title">500kg زنجر</h1>
            <p class="meal-description">نصف كيلو زنجر يتكون من نصف كيلو زنجر مع الفنكر والصمون الكهرباىْي والصلصات</p>

            <div class="meal-price">
                <span id="price-output">10,000</span>  د.ع 
            </div>
            <div class="quantity-counter">
                <button id="minus-btn" class="counter-btn">-</button>
                <span id="quantity-number">1</span>
                <button id="plus-btn" class="counter-btn">+</button>
            </div>
            <button class="buy-now-btn">
                <span class="btn-text">أشتري الان</span>
                <svg class="btn-icon" viewBox="0 0 24 24" width="20" height="20">
                </svg>
            </button>
        </div>
    </div>
</div>
<script>
    const plusBtn = document.getElementById('plus-btn');
const minusBtn = document.getElementById('minus-btn');
const quantityNumber = document.getElementById('quantity-number');
const priceOutput = document.getElementById('price-output');

const basePrice = 10000;
let count = 1;

function formatPrice(number){
    return number.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
}

function updateDisplay(){
    quantityNumber.textContent = count;
    let totalPrice = count * basePrice;
    priceOutput.textContent = formatPrice(totalPrice);
}

plusBtn.addEventListener('click', () =>{
    count++;
    updateDisplay();
});
minusBtn.addEventListener('click',() =>{
    if(count > 1){
        count--;
        updateDisplay();
    }
});
updateDisplay()
</script>
<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body,html{
    height: 100%;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    direction: rtl;
    overflow-x: hidden;
}
.page-container{
    display: flex;
    height: 100vh;
}
.right-side{
    flex: 1;
    height: 100%;
    padding: 30px ;
    padding-top: 200px;
}
.right-side img{
    width: 80%;
    height: 80%;
    object-fit: cover;
    border-radius: 10%;
}
.left-side{
    flex: 1;
    background-color: #f9f9f9;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
}
.content-wrapper{
    max-width: 500px;
    display: flex;
    flex-direction: column;
    gap: 20px;
}
.meal-title{
    font-size: 36px;
    color: #222;
}
.meal-description{
    font-size: 16px;
    color: #666;
    line-height: 1.8;
}
.meal-price{
    font-size: 28px;
    font-weight: bold;
    color: #e44d26;
}
.quantity-counter{
    display: flex;
    align-items: center;
    gap: 20px;
    margin-top: 40px;
}
.counter-btn{
    width: 45px;
    height: 45px;
    border: 2px solid #ddd;
    background-color: #fff;
    border-radius: 10px;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
}
.counter-btn:hover{
    background-color: #e44d26;
    color: #fff;
    border-color: #e44d26;
}
#quantity-number{
    font-size: 24px;
    font-weight: bold;
    min-width: 40px;
    text-align: center;
    user-select: none;
}
.buy-now-btn{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background-color: #e44d26;
    color: #ffffff;
    border: none;
    border-radius: 12px;
    padding: 15px 30px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    margin-top: 15px;
    box-shadow: 0 4px 15px rgba(228,77,38,0.2);
}
.buy-now-btn:hover{
    background-color: #cb3b16;
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(228,77,38,0.4);
}
.buy-now-btn:active{
    transform: translateY(1px);
    box-shadow: 0 2px 10px rgba(228,77,38,0.2);
}
.btn-text{
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}
.btn-icon{
    transition: transform 0.3s ease;
}
.buy-now-btn:hover .btn-icon{
    transform: scale(1.1) rotate(-5deg);
}


@media(max-width:430px){
    *{
        overflow-x: hidden;
     }
     .page-container{
        flex-direction: column;
        height: auto;
        padding: 20px;
     }
     .right-side{
        margin-bottom: 10px;
        padding: 10px 0;
        align-items: center;
        text-align: center;
     }
     .right-side img{
        max-width: 90%; 
     }
     .left-side{
        padding: 10px 0;
     }
     .content-wrapper{
        align-items: center;
        text-align: center;
     }
    .btn-text{
        margin-right: 15px;
}
}
</style>
</body>
</html>
