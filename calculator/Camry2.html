<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تيوتا كامري 2023 - تفاصل الفخامه | شركة الطيف</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body{
            background-color: #0f172a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            direction: rtl;
        }
        .details-container{
            max-width: 1000px;
            margin: 50px auto;
            background-color: #1e293b;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            transition: transform 0.3s ease;
        }
        .main-info{
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            align-items: flex-start;
        }

        .car-large-img{
            flex: 1.2;
            min-width: 300px;
            max-width: 550px;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            object-fit: cover;
            border: 2px solid#334155;
            transition: all 0.3s ease;
        }

        .car-large-img:hover{
            transform: scale(1.03);
            border-color: #f39c12;
        }

        .car-specs{
            flex: 1;
            min-width: 300px;
        }

        .car-specs h1{
            color: #f39c12;
            font-size: 2.5rem;
            margin-top: 0;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .spec-item{
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 18px;
            font-size: 1.2rem;
            border-bottom: 1px solid#334155;
            padding-bottom: 10px;
        }

        .spec-item:hover{
            background-color: #334155;
            border-radius: 5px;
            padding-right: 5px;
        }

        .spec-item i{
            color: #f39c12;
            font-size: 1.4rem;
            width: 30px;
            text-align: center;
        }

        .spec-features{
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .car-price{
            font-size: 2.2rem;
            color: #f39c12;
            font-weight: bold;
            margin-top: 30px;
            margin-bottom: 15px;
            display: block;
            text-align: center;
            background-color: #0f172a;
            padding: 10px;
            border-radius: 8px;
        }

        .book-now-btn{
            display: block;
            width: 100%;
            text-align: center;
            background: linear-gradient(to left, #f39c12, #e67e22);
            color: #0f172a;
            padding: 15px;
            font-size: 1.5rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            margin-top: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .book-now-btn:hover{
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(243, 156, 18, 0.4);
        }

        .back-btn{
            display: inline-block;
            color: #f39c12;
            text-decoration: none;
            margin-bottom: 30px;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .back-btn i{
            margin-left: 10px;
        }
        @media(max-width:430px){
            body{
                padding: 10px;
            }
            .details-container{
                margin: 15px;
                padding: 20px;
            }
            .main-info{
                flex-direction: column;
                gap: 25px;
            }
            .car-large-img{
                max-width: 100%;
                min-width: 100%;
            }
            .car-specs h1{
                font-size: 1.8rem;
                text-align: center;
                margin-bottom: 15px;
            }
            .spec-item{
                font-size: 1rem;
               display: flex;
               align-items: center;
               justify-content: flex-start;
               padding: 10px 5px;
               margin-bottom: 12px;
               width: 80%;
               box-sizing: border-box;
               white-space: normal;
            }
            .spec-item i{
                font-size: 15px;
                flex-shrink: 0;
            }
            .car-price{
                font-size: 1.6rem;
                margin-top: 20px;
            }
            .book-now-btn{
                font-size: 1.2rem;
                padding: 12px 30px;
                width: auto;
                max-width: 200px;
                margin: 20px auto 0px;
                margin-right: 18px;
                display: flex;
                align-items: center;
                justify-content: center;
                box-sizing: border-box;
            }
            *{
                overflow-x: hidden;
            }
           
        }
    </style>
</head>
<body>
    <div class="details-container">
        <a href="../calculator/tawtwa.html" class="back-btn"><i class="fas fa-arrow-right"></i>العوده للرىْيسيه</a>
        <div class="main-info">
            <img src="../img/1-2.webp" class="car-large-img">
            <div class="car-specs">
                <h1>تيوتا - كامري</h1>
                <div class="spec-item"><i class="fas fa-globe"></i><span>المنشأ: اليابان</span></div>
                <div class="spec-item"><i class="fas fa-calendar-alt"></i><span>الموديل: 2023</span></div>
                <div class="spec-item"><i class="fas fa-cogs"></i><span>المحرك: 2.0 cylinder-4</span></div>
                <div class="spec-item"><i class="fas fa-star"></i><span>المميزات: بصمة تشغيل - شاشة ذكيه - دفع رباعي - أقتصاديه</span></div>
                <div class="car-price">

                </div>
                <a href="#" class="book-now-btn">احجز الان</a>
            </div>
        </div>
    </div>
    
</body>

</html>
